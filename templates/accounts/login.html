{% extends "pipelines/base.html" %}

{% block title %}Login | Data Pipeline Platform{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
    <div class="col-md-4">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <div class="text-center mb-4">
                    <i class="bi bi-diagram-3-fill text-primary fs-1"></i>
                    <h2 class="h4 mt-2 mb-1">Sign In</h2>
                    <p class="text-muted small">Enter your credentials to continue</p>
                </div>

                <form method="POST">
                    {% csrf_token %}

                    <!-- Username -->
                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Username</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                            <input type="text" name="username" class="form-control" placeholder="Enter username"
                                required autofocus>
                        </div>
                    </div>

                    <!-- Password -->
                    <div class="mb-4">
                        <label class="form-label small fw-semibold">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                            <input type="password" name="password" class="form-control" placeholder="Enter password"
                                required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2">
                        <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
                    </button>
                </form>

                <div class="text-center mt-3 text-muted small">
                    Don't have an account? <a href="{% url 'register-page' %}" class="text-decoration-none">Register
                        here</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
